name: 编译 fanchmwrt (Xiaomi AX3000T · PassWall 精简版 · 仅 sing-box)

# ★ 与 build.yml（完整版）的差异：
#   1. 配置用 config/ax3000t-passwall-mini.config：PassWall 只带 sing-box-tiny + ipt2socks，
#      砍 shadowsocks-rust / shadowsocksr-libev / simple-obfs / v2ray-plugin / haproxy。
#      （不再编 rust → 不拖入 LLVM + rustc，预计比完整版快约 2 小时。）
#   2. 仅 workflow_dispatch 手动触发，无 push 触发（避免与完整版互相拉起编译）。
#   3. 取消列表校验与 manifest 终检覆盖全部被砍组件。
#   其余步骤（distfeeds 镜像源 / HomeProxy DNS 注入 / 其他应用）与完整版完全一致。

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: '编译失败时开启 SSH 调试 (true/false)'
        required: false
        default: 'false'
      apply_feeds_patches:
        description: '是否套用 fanchmwrt 对 luci feed 的补丁 (true/false)'
        required: false
        default: 'true'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/fanchmwrt/fanchmwrt
  REPO_BRANCH: fanchmwrt-25.12.4
  CONFIG_FILE: config/ax3000t-passwall-mini.config
  IMM_SRC: immortalwrt-src
  TARGET: mediatek/filogic
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: 检出本仓库（含 diy 脚本与配置）
        uses: actions/checkout@v4

      # OpenWrt 全量编译需要 ~25GB，GitHub 免费 runner 默认不够
      - name: 释放磁盘空间
        run: |
          echo "清理前："; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/share/swift /usr/local/go /opt/hostedtoolcache/go
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile || true
          echo "清理后："; df -h /

      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools python3-dev \
            rsync unzip zlib1g-dev file wget subversion quilt ecj fastjar \
            java-propose-classpath libelf-dev libglib2.0-dev libtool autoconf \
            automake libpcre3-dev ccache
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          df -h

      - name: 浅克隆 fanchmwrt 源码 (分支 ${{ env.REPO_BRANCH }})
        run: |
          git clone --depth 1 --single-branch --branch "$REPO_BRANCH" "$REPO_URL" openwrt
          cd openwrt
          echo "源码版本："; cat version 2>/dev/null || true; cat version.date 2>/dev/null || true

      # 只取 ImmortalWrt 里官方 feed 没有的那几个包，避免整仓 fork 造成重名冲突
      - name: 稀疏拉取 ImmortalWrt 扩展包
        run: |
          chmod +x scripts/prepare-immortalwrt-feeds.sh
          ./scripts/prepare-immortalwrt-feeds.sh "$GITHUB_WORKSPACE/$IMM_SRC"

      - name: 注入额外插件 feed (diy-part1)
        env:
          IMM_SRC: ${{ github.workspace }}/immortalwrt-src
        run: |
          cp "$GITHUB_WORKSPACE/diy-part1.sh" openwrt/diy-part1.sh
          cd openwrt
          chmod +x diy-part1.sh
          ./diy-part1.sh

      # luci-app-pushbot 是「根目录即包目录」的单包仓库（Makefile 在仓库根），
      # 这种结构当不了 feed：scripts/feeds 的 crawl 只认 <feed>/<包名>/Makefile 这一层，
      # 仓库根的 Makefile 永远扫不到。所以直接克隆进 package/ 当本地包 —— 上游 CI 也是这么做的。
      - name: 注入 luci-app-pushbot（本地包，非 feed）
        run: |
          set -e
          cd openwrt
          rm -rf package/luci-app-pushbot
          git clone --depth 1 --single-branch --branch master \
            https://github.com/zzsj0928/luci-app-pushbot.git package/luci-app-pushbot
          # 只留包本体：.git 没用，.github 里是上游自己的 workflow
          rm -rf package/luci-app-pushbot/.git package/luci-app-pushbot/.github

          test -f package/luci-app-pushbot/Makefile \
            || { echo "!! pushbot/Makefile 不存在，克隆异常"; exit 1; }
          grep -qE 'call (Build/DefaultTargets|BuildPackage|KernelPackage)' package/luci-app-pushbot/Makefile \
            || { echo "!! pushbot/Makefile 缺 BuildPackage 标记，scan.mk 会扫不到"; exit 1; }
          grep -q 'feeds/luci/luci.mk' package/luci-app-pushbot/Makefile \
            || { echo "!! pushbot/Makefile 的 luci.mk include 路径变了，需人工确认"; exit 1; }
          echo "pushbot 版本：$(grep -E '^PKG_VERSION' package/luci-app-pushbot/Makefile)"
          ls package/luci-app-pushbot

      - name: 更新 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          find feeds -mindepth 2 -maxdepth 2 -name '.git' -type d -exec rm -rf {} + 2>/dev/null || true
          find feeds -mindepth 2 -maxdepth 2 -name '.github' -type d -exec rm -rf {} + 2>/dev/null || true

      # 官方 feed 全量安装；第三方 feed 只装白名单包。
      # 绝不能对第三方 feed 用 install -a —— 会与官方 feed 产生大量重名包。
      - name: 安装 feeds（官方全量 + 第三方白名单）
        run: |
          set -e
          cd openwrt

          echo "===== 1) 官方 feed 全量安装 ====="
          for f in packages luci routing telephony video fanchmwrt; do
            echo "--> feeds install -a -p $f"
            ./scripts/feeds install -a -p "$f"
          done

          echo "===== 2) 第三方 feed 白名单安装 ====="
          ./scripts/feeds install -p passwall_luci      luci-app-passwall

          # ★ 精简版仍要装全部 PassWall 组件源包（包括被砍的那些）：
          #   INCLUDE_* 段是 luci-app-passwall/Makefile 里的原生 Kconfig select，
          #   对应源包不在 package/feeds/ 时 PACKAGE_xxx 符号根本不存在，
          #   .config 里的 INCLUDE_*=n 会被 make defconfig 静默丢行，
          #   配置校验就失去断言能力（「被砍」变成「未定义」）。
          #   装进 feeds ≠ 编进固件：是否编译由 .config 的 INCLUDE_*=n 决定。
          #   （shadowsocks-rust 装而不编 —— 省下的 2h 来自不编译它本身。）
          ./scripts/feeds install -p passwall_packages  \
            geoview ipt2socks simple-obfs v2ray-plugin shadowsocks-rust shadowsocksr-libev

          ./scripts/feeds install -p luci_app_easytier  luci-app-easytier easytier
          ./scripts/feeds install -p immortalwrt_packages vlmcsd rtp2httpd
          ./scripts/feeds install -p immortalwrt_luci   luci-app-vlmcsd luci-app-rtp2httpd luci-app-homeproxy

          echo "===== 3) 去重保险：第三方与官方重名的软链一律删除（官方优先）====="
          for td in passwall_luci passwall_packages luci_app_easytier \
                    immortalwrt_packages immortalwrt_luci; do
            [ -d "package/feeds/$td" ] || continue
            for name in $(ls "package/feeds/$td"); do
              for of in packages luci routing telephony video fanchmwrt; do
                if [ -e "package/feeds/$of/$name" ]; then
                  echo "  [去重] 删除 $td/$name（改用官方 $of 版本）"
                  rm -f "package/feeds/$td/$name"
                  break
                fi
              done
            done
          done

          echo "===== 已安装的第三方包 ====="
          for td in passwall_luci passwall_packages luci_app_easytier \
                    immortalwrt_packages immortalwrt_luci; do
            echo "--- $td ---"; ls "package/feeds/$td" 2>/dev/null || echo "(无)"
          done

      # 可选：套用 fanchmwrt 对 luci feed 的本地补丁（feeds_patches/luci）
      - name: 套用 fanchmwrt luci feed 补丁
        if: ${{ github.event.inputs.apply_feeds_patches != 'false' }}
        run: |
          cd openwrt
          [ -d feeds_patches/luci ] || { echo "无 feeds_patches/luci，跳过"; exit 0; }
          cnt=0
          while IFS= read -r p; do
            rel="${p#feeds_patches/luci/}"
            d="feeds/luci/$(dirname "$rel")"
            [ -d "$d" ] || { echo "  [跳过] 目标不存在: $d"; continue; }
            if patch -p1 --dry-run -d "$d" < "$p" >/dev/null 2>&1; then
              patch -p1 -d "$d" < "$p"
              echo "  [已套用] $rel"
              cnt=$((cnt+1))
            else
              echo "  [跳过] 打不上（上游已变更或冲突）: $rel"
            fi
          done < <(find feeds_patches/luci -name '*.patch' -o -name '*.diff' | sort)
          echo "共套用 $cnt 个补丁"

      # ---------------------------------------------------------------
      # 把 base-files 生成的 distfeeds.list 换成「自选镜像源」固定 7 条
      # （与完整版 build.yml 同一套补丁：必须改 Makefile，
      #  FeedSourcesAppendAPK 用 `>` 写盘会覆盖静态文件。）
      # ---------------------------------------------------------------
      - name: 写入自定义 distfeeds.list（镜像源）
        run: |
          set -e
          cd openwrt
          python3 - <<'PY'
          import pathlib

          URLS = [
              "https://mirrors.vsean.net/openwrt/releases/25.12-SNAPSHOT/targets/mediatek/filogic/packages/packages.adb",
              "https://mirrors.vsean.net/openwrt/releases/25.12-SNAPSHOT/packages/aarch64_cortex-a53/base/packages.adb",
              "https://mirrors.pku.edu.cn/immortalwrt/releases/25.12-SNAPSHOT/targets/mediatek/filogic/kmods/6.12.103-1-b5b7729ffbba3ecdd83f339de8fadfb8//packages.adb",
              "https://mirrors.vsean.net/openwrt/releases/25.12-SNAPSHOT/packages/aarch64_cortex-a53/luci/packages.adb",
              "https://mirrors.vsean.net/openwrt/releases/25.12-SNAPSHOT/packages/aarch64_cortex-a53/packages/packages.adb",
              "https://mirrors.vsean.net/openwrt/releases/25.12-SNAPSHOT/packages/aarch64_cortex-a53/routing/packages.adb",
              "https://mirrors.vsean.net/openwrt/releases/25.12-SNAPSHOT/packages/aarch64_cortex-a53/telephony/packages.adb",
          ]

          p = pathlib.Path("package/base-files/Makefile")
          s = p.read_text()

          OLD = (
              "\t$(call FeedSourcesAppendAPK,$(1)/etc/apk/repositories.d/distfeeds.list)\n"
              "\tsed -i '/fanchmwrt/d' $(1)/etc/apk/repositories.d/distfeeds.list\n"
              "\t$(VERSION_SED_SCRIPT) $(1)/etc/apk/repositories.d/distfeeds.list\n"
          )
          NEW = (
              "\tprintf '%s\\n' "
              + " ".join("'" + u + "'" for u in URLS)
              + " > $(1)/etc/apk/repositories.d/distfeeds.list\n"
          )

          assert s.count(OLD) == 1, "base-files/Makefile 的 distfeeds 生成段与预期不符（匹配 %d 处），需人工核对" % s.count(OLD)
          p.write_text(s.replace(OLD, NEW))

          chk = p.read_text()
          assert "FeedSourcesAppendAPK,$(" not in chk, "补丁没生效：FeedSourcesAppendAPK 调用仍在"
          assert "VERSION_SED_SCRIPT) $(1)/etc/apk/repositories.d/distfeeds.list" not in chk, "VERSION_SED_SCRIPT 那行还在"
          n = chk.count("packages.adb'")
          assert n == len(URLS), "写入条目数 %d != %d" % (n, len(URLS))
          print("已打补丁：distfeeds.list 固定为 %d 条镜像源" % n)
          PY

          echo "----- 补丁后的生成段 -----"
          grep -n -B1 -A1 'repositories.d/distfeeds.list' package/base-files/Makefile

      # ---------------------------------------------------------------
      # 给 HomeProxy 的出厂配置加一条 DNS 服务器（与完整版一致）
      # ---------------------------------------------------------------
      - name: 注入 HomeProxy 默认 DNS 条目
        run: |
          set -e
          cd openwrt
          F=""
          for c in package/feeds/immortalwrt_luci/luci-app-homeproxy \
                   "$GITHUB_WORKSPACE/$IMM_SRC/luci/luci-app-homeproxy" \
                   "../$IMM_SRC/luci/luci-app-homeproxy"; do
            if [ -f "$c/root/etc/config/homeproxy" ]; then F="$c/root/etc/config/homeproxy"; break; fi
          done
          [ -n "$F" ] || { echo "!! 找不到 luci-app-homeproxy 的出厂配置（feeds install 是否成功？）"; exit 1; }
          echo "目标文件：$F"

          if grep -q '2a01:4f8:c2c:123f::1' "$F"; then
            echo "已存在该地址，跳过注入"
          else
            printf '\nconfig dns_server\n\toption label "2a01:4f8:c2c:123f::1"\n\toption enabled "1"\n\toption type "udp"\n\toption server "2a01:4f8:c2c:123f::1"\n' >> "$F"
          fi

          echo "----- 注入后的 DNS 段 -----"
          sed -n '/^config dns_server/,$p' "$F"
          grep -q '^config dns_server' "$F" || { echo "!! 没有 config dns_server 段"; exit 1; }
          grep -q 'option server "2a01:4f8:c2c:123f::1"' "$F" || { echo "!! server 值写入不对"; exit 1; }
          echo "HomeProxy DNS 条目注入完成"

      - name: 载入配置并生成完整 .config
        run: |
          set -e
          cd openwrt
          cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config

          # ccache 加速（配合后面的 actions/cache）
          echo "CONFIG_CCACHE=y" >> .config

          make defconfig

          echo "===== 关键包校验（缺任何一个直接失败）====="
          REQUIRED="
            CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t
            CONFIG_PACKAGE_luci-app-passwall
            CONFIG_PACKAGE_luci-app-homeproxy
            CONFIG_PACKAGE_luci-app-easytier
            CONFIG_PACKAGE_easytier
            CONFIG_PACKAGE_luci-app-frps
            CONFIG_PACKAGE_luci-app-vlmcsd
            CONFIG_PACKAGE_luci-app-rtp2httpd
            CONFIG_PACKAGE_rtp2httpd
            CONFIG_PACKAGE_ddns-scripts-dnspod
            CONFIG_PACKAGE_openssh-sftp-server
            CONFIG_PACKAGE_ipt2socks
            CONFIG_PACKAGE_sing-box-tiny
            CONFIG_PACKAGE_bind-host
            CONFIG_PACKAGE_luci-app-pushbot
            CONFIG_PACKAGE_luci-i18n-pushbot-zh-cn
          "
          fail=0
          for k in $REQUIRED; do
            if grep -q "^$k=y" .config; then echo "  [OK]   $k=y"; else echo "  [FAIL] $k 未启用"; fail=1; fi
          done

          # ★ 精简版取消列表：sing-box 只允许 tiny 变体；xray-core / geoview 与完整版相同；
          #   另加精简版砍除的五件套（haproxy / shadowsocks-rust / shadowsocksr-libev /
          #   simple-obfs / v2ray-plugin）。每个 select 引入项都必须把对应 INCLUDE_* 一并盯住。
          echo "===== 「取消列表」校验（必须未启用）====="
          FORBIDDEN="
            CONFIG_PACKAGE_sing-box
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox
            CONFIG_PACKAGE_xray-core
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray
            CONFIG_PACKAGE_geoview
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Geoview
            CONFIG_PACKAGE_haproxy
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Haproxy
            CONFIG_PACKAGE_shadowsocks-rust
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Server
            CONFIG_PACKAGE_shadowsocksr-libev
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Client
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Server
            CONFIG_PACKAGE_simple-obfs-client
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Simple_Obfs
            CONFIG_PACKAGE_v2ray-plugin
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Plugin
          "
          for k in $FORBIDDEN; do
            if grep -q "^$k=y" .config; then
              echo "  [FAIL] $k=y —— 与精简目标冲突"; fail=1
            else
              echo "  [OK]   $k 未启用"
            fi
          done

          echo "----- 代理组件实况（应只见 sing-box-tiny + ipt2socks）-----"
          grep -E '^CONFIG_PACKAGE_(sing-box|xray-core|haproxy|shadowsocks-rust|shadowsocksr-libev|simple-obfs-client|v2ray-plugin)|^# CONFIG_PACKAGE_(sing-box|xray-core|haproxy|shadowsocks-rust|shadowsocksr-libev|simple-obfs-client|v2ray-plugin)' .config || echo "  (无)"

          [ "$fail" -eq 0 ] || { echo "配置校验失败，终止编译"; exit 1; }

          echo "===== 磁盘占用 ====="; df -h /; du -sh . 2>/dev/null || true

      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-mini-${{ env.REPO_BRANCH }}-${{ github.sha }}
          restore-keys: ccache-mini-${{ env.REPO_BRANCH }}-

      - name: 下载源码包 (dl)
        run: |
          cd openwrt
          make download -j$(nproc) || make download -j1 V=s

      - name: 编译固件
        id: compile
        run: |
          set -o pipefail
          cd openwrt
          echo "开始编译：$(date)"
          make -j$(( $(nproc) + 1 )) || make -j1 V=s
          echo "status=success" >> "$GITHUB_OUTPUT"
          echo "编译结束：$(date)"
          ls -lh bin/targets/${{ env.TARGET }}/

      - name: 显示产物
        if: steps.compile.outputs.status == 'success'
        run: |
          ls -lh openwrt/bin/targets/${{ env.TARGET }}/
          echo "----- feeds 包（bin/packages）-----"
          echo "  apk 数量: $(find openwrt/bin/packages -name '*.apk' 2>/dev/null | wc -l)"
          du -sh openwrt/bin/packages 2>/dev/null || true
          echo "----- 代理组件终检：五件套必须全部缺席、sing-box 必须在 -----"
          MAN=$(ls openwrt/bin/targets/${{ env.TARGET }}/*.manifest 2>/dev/null | head -1)
          if [ -n "$MAN" ]; then
            fail=0
            # 被砍组件：一个都不能出现在 manifest 里
            for bad in xray-core geoview haproxy shadowsocks-rust shadowsocksr-libev simple-obfs-client v2ray-plugin; do
              if grep -q "^$bad " "$MAN"; then
                echo "  [FAIL] manifest 里出现 $bad —— 与精简目标冲突"
                fail=1
              else
                echo "  [OK]   manifest 里没有 $bad"
              fi
            done
            # 必需组件
            grep -E '^(sing-box|sing-box-tiny|ipt2socks|luci-app-passwall) ' "$MAN" || { echo "  [FAIL] 未见 sing-box / ipt2socks / passwall"; fail=1; }
            if [ "$fail" -ne 0 ]; then exit 1; fi
          else
            echo "  (未找到 manifest)"
            exit 1
          fi
          echo "----- 分区/体积对照 -----"
          echo "AX3000T stock 布局：ubi_kernel 34MB / ubi 78MB（rootfs 落在这里）"

      - name: SSH 调试（失败时可选）
        if: (failure() || cancelled()) && inputs.ssh == 'true'
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 60

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-ax3000t-passwall-mini-logs
          include-hidden-files: true
          path: |
            openwrt/logs/
            openwrt/.config
          if-no-files-found: ignore
          retention-days: 7

      - name: 上传固件
        if: steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-ax3000t-passwall-mini-${{ github.run_number }}
          path: |
            openwrt/bin/targets/${{ env.TARGET }}/*.bin
            openwrt/bin/targets/${{ env.TARGET }}/*.ubi
            openwrt/bin/targets/${{ env.TARGET }}/*.itb
            openwrt/bin/targets/${{ env.TARGET }}/*.tar.gz
            openwrt/bin/targets/${{ env.TARGET }}/*.manifest
            openwrt/bin/targets/${{ env.TARGET }}/packages/**
            openwrt/bin/packages/**
          if-no-files-found: warn
          retention-days: 14
