name: 编译 fanchmwrt (Xiaomi AX3000T · stock)

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: '编译失败时开启 SSH 调试 (true/false)'
        required: false
        default: 'false'
      apply_feeds_patches:
        description: '是否套用 fanchmwrt 对 luci feed 的补丁 (true/false)'
        required: false
        default: 'true'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'config/**'
      - 'diy-part1.sh'
      - 'scripts/**'

# 一次推送多个文件会产生多个 commit，进而拉起多个并发编译。
# 加并发锁：同一分支只保留最新一次运行，新提交自动取消旧运行，
# 避免 N 份全量 OpenWrt 编译互相抢占 runner 与 dl 缓存。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/fanchmwrt/fanchmwrt
  REPO_BRANCH: fanchmwrt-25.12.4
  CONFIG_FILE: config/ax3000t-stock.config
  IMM_SRC: immortalwrt-src
  TARGET: mediatek/filogic
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: 检出本仓库（含 diy 脚本与配置）
        uses: actions/checkout@v4

      # OpenWrt 全量编译需要 ~25GB，GitHub 免费 runner 默认不够
      - name: 释放磁盘空间
        run: |
          echo "清理前："; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/share/swift /usr/local/go /opt/hostedtoolcache/go
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile || true
          echo "清理后："; df -h /

      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools python3-dev \
            rsync unzip zlib1g-dev file wget subversion quilt ecj fastjar \
            java-propose-classpath libelf-dev libglib2.0-dev libtool autoconf \
            automake libpcre3-dev ccache
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          df -h

      - name: 浅克隆 fanchmwrt 源码 (分支 ${{ env.REPO_BRANCH }})
        run: |
          git clone --depth 1 --single-branch --branch "$REPO_BRANCH" "$REPO_URL" openwrt
          cd openwrt
          echo "源码版本："; cat version 2>/dev/null || true; cat version.date 2>/dev/null || true

      # 只取 ImmortalWrt 里官方 feed 没有的那几个包，避免整仓 fork 造成重名冲突
      - name: 稀疏拉取 ImmortalWrt 扩展包
        run: |
          chmod +x scripts/prepare-immortalwrt-feeds.sh
          ./scripts/prepare-immortalwrt-feeds.sh "$GITHUB_WORKSPACE/$IMM_SRC"

      - name: 注入额外插件 feed (diy-part1)
        env:
          IMM_SRC: ${{ github.workspace }}/immortalwrt-src
        run: |
          cp "$GITHUB_WORKSPACE/diy-part1.sh" openwrt/diy-part1.sh
          cd openwrt
          chmod +x diy-part1.sh
          ./diy-part1.sh

      - name: 更新 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          # 删掉各 feed 的 .git 和 .github 省空间（后续编译不再需要）
          find feeds -mindepth 2 -maxdepth 2 -name '.git' -type d -exec rm -rf {} + 2>/dev/null || true
          find feeds -mindepth 2 -maxdepth 2 -name '.github' -type d -exec rm -rf {} + 2>/dev/null || true

      # 官方 feed 全量安装；第三方 feed 只装白名单包。
      # 绝不能对第三方 feed 用 install -a —— 会与官方 feed 产生大量重名包。
      - name: 安装 feeds（官方全量 + 第三方白名单）
        run: |
          set -e
          cd openwrt

          echo "===== 1) 官方 feed 全量安装 ====="
          for f in packages luci routing telephony video fanchmwrt; do
            echo "--> feeds install -a -p $f"
            ./scripts/feeds install -a -p "$f"
          done

          echo "===== 2) 第三方 feed 白名单安装 ====="
          ./scripts/feeds install -p passwall_luci      luci-app-passwall
          ./scripts/feeds install -p luci_app_easytier  luci-app-easytier easytier
          ./scripts/feeds install -p immortalwrt_packages vlmcsd rtp2httpd
          ./scripts/feeds install -p immortalwrt_luci   luci-app-vlmcsd luci-app-rtp2httpd luci-app-homeproxy

          echo "===== 3) 去重保险：第三方与官方重名的软链一律删除（官方优先）====="
          for td in passwall_luci passwall_packages luci_app_easytier \
                    immortalwrt_packages immortalwrt_luci; do
            [ -d "package/feeds/$td" ] || continue
            for name in $(ls "package/feeds/$td"); do
              for of in packages luci routing telephony video fanchmwrt; do
                if [ -e "package/feeds/$of/$name" ]; then
                  echo "  [去重] 删除 $td/$name（改用官方 $of 版本）"
                  rm -f "package/feeds/$td/$name"
                  break
                fi
              done
            done
          done

          echo "===== 已安装的第三方包 ====="
          for td in passwall_luci passwall_packages luci_app_easytier \
                    immortalwrt_packages immortalwrt_luci; do
            echo "--- $td ---"; ls "package/feeds/$td" 2>/dev/null || echo "(无)"
          done

      # 可选：套用 fanchmwrt 对 luci feed 的本地补丁（feeds_patches/luci）
      - name: 套用 fanchmwrt luci feed 补丁
        if: ${{ github.event.inputs.apply_feeds_patches != 'false' }}
        run: |
          cd openwrt
          [ -d feeds_patches/luci ] || { echo "无 feeds_patches/luci，跳过"; exit 0; }
          cnt=0
          while IFS= read -r p; do
            rel="${p#feeds_patches/luci/}"
            d="feeds/luci/$(dirname "$rel")"
            [ -d "$d" ] || { echo "  [跳过] 目标不存在: $d"; continue; }
            if patch -p1 --dry-run -d "$d" < "$p" >/dev/null 2>&1; then
              patch -p1 -d "$d" < "$p"
              echo "  [已套用] $rel"
              cnt=$((cnt+1))
            else
              echo "  [跳过] 打不上（上游已变更或冲突）: $rel"
            fi
          done < <(find feeds_patches/luci -name '*.patch' -o -name '*.diff' | sort)
          echo "共套用 $cnt 个补丁"

      - name: 载入配置并生成完整 .config
        run: |
          set -e
          cd openwrt
          cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config

          # ccache 加速（配合后面的 actions/cache）
          echo "CONFIG_CCACHE=y" >> .config

          make defconfig

          echo "===== 关键包校验（缺任何一个直接失败）====="
          REQUIRED="
            CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t
            CONFIG_PACKAGE_luci-app-passwall
            CONFIG_PACKAGE_luci-app-homeproxy
            CONFIG_PACKAGE_luci-app-easytier
            CONFIG_PACKAGE_easytier
            CONFIG_PACKAGE_luci-app-frps
            CONFIG_PACKAGE_luci-app-vlmcsd
            CONFIG_PACKAGE_luci-app-rtp2httpd
            CONFIG_PACKAGE_rtp2httpd
            CONFIG_PACKAGE_ddns-scripts-dnspod
            CONFIG_PACKAGE_openssh-sftp-server
          "
          fail=0
          for k in $REQUIRED; do
            if grep -q "^$k=y" .config; then echo "  [OK]   $k=y"; else echo "  [FAIL] $k 未启用"; fail=1; fi
          done
          [ "$fail" -eq 0 ] || { echo "配置校验失败，终止编译"; exit 1; }

          echo "===== 磁盘占用 ====="; df -h /; du -sh . 2>/dev/null || true

      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ env.REPO_BRANCH }}-${{ github.sha }}
          restore-keys: ccache-${{ env.REPO_BRANCH }}-

      - name: 下载源码包 (dl)
        run: |
          cd openwrt
          make download -j$(nproc) || make download -j1 V=s

      - name: 编译固件
        id: compile
        run: |
          set -o pipefail
          cd openwrt
          echo "开始编译：$(date)"
          make -j$(( $(nproc) + 1 )) || make -j1 V=s
          echo "status=success" >> "$GITHUB_OUTPUT"
          echo "编译结束：$(date)"
          ls -lh bin/targets/${{ env.TARGET }}/

      - name: 显示产物
        if: steps.compile.outputs.status == 'success'
        run: |
          ls -lh openwrt/bin/targets/${{ env.TARGET }}/
          echo "----- 分区/体积对照 -----"
          echo "AX3000T stock 布局：ubi_kernel 34MB / ubi 78MB（rootfs 落在这里）"

      - name: SSH 调试（失败时可选）
        if: (failure() || cancelled()) && inputs.ssh == 'true'
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 60

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-ax3000t-stock-logs
          path: |
            openwrt/logs/
            openwrt/.config
          if-no-files-found: ignore
          retention-days: 7

      - name: 上传固件
        if: steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-ax3000t-stock-${{ github.run_number }}
          path: |
            openwrt/bin/targets/${{ env.TARGET }}/*.bin
            openwrt/bin/targets/${{ env.TARGET }}/*.itb
            openwrt/bin/targets/${{ env.TARGET }}/*.manifest
            openwrt/bin/targets/${{ env.TARGET }}/packages/**
          if-no-files-found: warn
          retention-days: 14
