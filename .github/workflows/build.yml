name: 编译 fanchmwrt (Xiaomi AX3000T · stock)

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: '编译失败时开启 SSH 调试 (true/false)'
        required: false
        default: 'false'
      apply_feeds_patches:
        description: '是否套用 fanchmwrt 对 luci feed 的补丁 (true/false)'
        required: false
        default: 'true'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'config/**'
      - 'diy-part1.sh'
      - 'scripts/**'

# 一次推送多个文件会产生多个 commit，进而拉起多个并发编译。
# 加并发锁：同一分支只保留最新一次运行，新提交自动取消旧运行，
# 避免 N 份全量 OpenWrt 编译互相抢占 runner 与 dl 缓存。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/fanchmwrt/fanchmwrt
  REPO_BRANCH: fanchmwrt-25.12.4
  CONFIG_FILE: config/ax3000t-stock.config
  IMM_SRC: immortalwrt-src
  TARGET: mediatek/filogic
  ARCH_PKG: aarch64_cortex-a53
  TZ: Asia/Shanghai
  # ------------------------------------------------------------------
  # 「自建 apk 源」要发布的目录。
  #
  # 官方站 releases/25.12.4 只发布这 7 个目录：
  #   targets/<board>/<subtarget>/packages/packages.adb
  #   packages/<arch>/{base,packages,luci,routing,telephony,video}/packages.adb
  # 其余目录官方站上没有，固件里照抄它们就会 404（原版 fanchmwrt 把
  # passwall_luci / passwall_packages / luci_app_easytier / immortalwrt_luci /
  # immortalwrt_packages 这 5 条第三方 feed 原样写进 distfeeds.list，`apk update`
  # 必然报错）—— 所以这些包必须由本次编译自己发布，源 URL 里带 run 号，
  # 「这一次编译的固件」只认「这一次编译发布的包」，版本与签名天然一致。
  #
  # SELF_FEEDS  —— 位于 bin/packages/<arch>/<feed>/ 的目录
  #   base：所有「无 FEED 且非 nonshared」的包。apk-selfrepo 自己、
  #         luci-app-pushbot、fwxd 等本地包都落在这里，必须发布，
  #         否则自建源自身就没法从网上补装。
  #   fanchmwrt / passwall_* / luci_app_easytier / immortalwrt_*：第三方 feed 包。
  #
  # SELF_TARGET —— bin/targets/<board>/<subtarget>/packages/
  #   依据 include/package-dumpinfo.mk：`PKGFLAGS` 含 nonshared 的包不写
  #   `Repository:` → 没有 subdir → 落回 PACKAGE_DIR（= BIN_DIR/packages，
  #   见 rules.mk:180），也就是 target 目录。kmod-* 与 kernel / base-files /
  #   libc 全在这里。
  #   ⚠️ 本固件没开 CONFIG_BUILDBOT，所以 **不存在** bin/targets/<t>/kmods/
  #      （官方的 kmods/ 是 buildbot 专属，见 include/feeds.mk 里
  #       `$(if $(CONFIG_BUILDBOT), echo .../kmods/...)`）。写 kmods 会 404。
  # ------------------------------------------------------------------
  SELF_FEEDS: base fanchmwrt passwall_luci passwall_packages luci_app_easytier immortalwrt_luci immortalwrt_packages
  SELF_TARGET: target

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      # 发布自建 apk 源要往本仓库建 Release，因此需要写权限（原来是只读）
      contents: write

    steps:
      - name: 检出本仓库（含 diy 脚本与配置）
        uses: actions/checkout@v4

      # OpenWrt 全量编译需要 ~25GB，GitHub 免费 runner 默认不够
      - name: 释放磁盘空间
        run: |
          echo "清理前："; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/share/swift /usr/local/go /opt/hostedtoolcache/go
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile || true
          echo "清理后："; df -h /

      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools python3-dev \
            rsync unzip zlib1g-dev file wget subversion quilt ecj fastjar \
            java-propose-classpath libelf-dev libglib2.0-dev libtool autoconf \
            automake libpcre3-dev ccache
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          df -h

      - name: 浅克隆 fanchmwrt 源码 (分支 ${{ env.REPO_BRANCH }})
        run: |
          git clone --depth 1 --single-branch --branch "$REPO_BRANCH" "$REPO_URL" openwrt
          cd openwrt
          echo "源码版本："; cat version 2>/dev/null || true; cat version.date 2>/dev/null || true

      # 只取 ImmortalWrt 里官方 feed 没有的那几个包，避免整仓 fork 造成重名冲突
      - name: 稀疏拉取 ImmortalWrt 扩展包
        run: |
          chmod +x scripts/prepare-immortalwrt-feeds.sh
          ./scripts/prepare-immortalwrt-feeds.sh "$GITHUB_WORKSPACE/$IMM_SRC"

      - name: 注入额外插件 feed (diy-part1)
        env:
          IMM_SRC: ${{ github.workspace }}/immortalwrt-src
        run: |
          cp "$GITHUB_WORKSPACE/diy-part1.sh" openwrt/diy-part1.sh
          cd openwrt
          chmod +x diy-part1.sh
          ./diy-part1.sh

      # luci-app-pushbot 是「根目录即包目录」的单包仓库（Makefile 在仓库根），
      # 这种结构当不了 feed：scripts/feeds 的 crawl 只认 <feed>/<包名>/Makefile 这一层，
      # 仓库根的 Makefile 永远扫不到。所以直接克隆进 package/ 当本地包 —— 上游 CI 也是这么做的。
      - name: 注入 luci-app-pushbot（本地包，非 feed）
        run: |
          set -e
          cd openwrt
          rm -rf package/luci-app-pushbot
          git clone --depth 1 --single-branch --branch master \
            https://github.com/zzsj0928/luci-app-pushbot.git package/luci-app-pushbot
          # 只留包本体：.git 没用，.github 里是上游自己的 workflow
          rm -rf package/luci-app-pushbot/.git package/luci-app-pushbot/.github

          test -f package/luci-app-pushbot/Makefile \
            || { echo "!! pushbot/Makefile 不存在，克隆异常"; exit 1; }
          # scan.mk 用 `grep -aHE 'call (Build/DefaultTargets|BuildPackage|KernelPackage)'`
          # 发现包；该 Makefile 末尾那行 `# call BuildPackage - OpenWrt buildroot signature`
          # 注释正是为此存在。这里前置断言，避免扫不到后静默漏包。
          grep -qE 'call (Build/DefaultTargets|BuildPackage|KernelPackage)' package/luci-app-pushbot/Makefile \
            || { echo "!! pushbot/Makefile 缺 BuildPackage 标记，scan.mk 会扫不到"; exit 1; }
          grep -q 'feeds/luci/luci.mk' package/luci-app-pushbot/Makefile \
            || { echo "!! pushbot/Makefile 的 luci.mk include 路径变了，需人工确认"; exit 1; }
          echo "pushbot 版本：$(grep -E '^PKG_VERSION' package/luci-app-pushbot/Makefile)"
          ls package/luci-app-pushbot

      # ---------------------------------------------------------------
      # 生成「自建 apk 源清单」包（apk-selfrepo，编译时生成，不在 .git 里）
      #
      # 背景：官方 downloads.openwrt.org/releases/25.12.4 只发布 7 个目录
      #   targets/<t>/packages + packages/<arch>/{base,packages,luci,routing,telephony,video}
      # 而固件需要但官方站上没有的包有三类：
      #   · kmod-*                 —— 内核 vermagic 不同（我们 6.12.87~f6c83470…，
      #                               官方 6.12.87-1-82967b49…），官方 kmod 一律装不上
      #   · 本地包与第三方 feed 包 —— pushbot、apk-selfrepo、passwall 系列、
      #                               easytier、fwx 系列、vlmcsd/rtp2httpd 等
      #   · kernel / base-files / libc 等 nonshared 包 —— 只在本树编得出来
      # 所以由本次编译把它们发布到本仓库的 Release（见下面「发布自建 apk 源」步骤），
      # 固件的 99-selfrepo.list 指向带 run 号的 tag。
      # ---------------------------------------------------------------
      - name: 生成自建源清单包（apk-selfrepo）
        run: |
          set -e
          python3 - <<'PY'
          import io, os
          run  = os.environ["GITHUB_RUN_NUMBER"]
          repo = os.environ["GITHUB_REPOSITORY"]
          feeds = os.environ["SELF_FEEDS"].split()

          pkg = "openwrt/package/apk-selfrepo"
          os.makedirs(pkg + "/files/etc/apk/repositories.d", exist_ok=True)

          mk = (
              "include $(TOPDIR)/rules.mk\n\n"
              "PKG_NAME:=apk-selfrepo\n"
              "PKG_VERSION:=1.0\n"
              "PKG_RELEASE:=1\n"
              "PKG_LICENSE:=MIT\n\n"
              "include $(INCLUDE_DIR)/package.mk\n\n"
              "define Package/apk-selfrepo\n"
              "  SECTION:=base\n"
              "  CATEGORY:=Base system\n"
              "  TITLE:=本次编译自建 apk 源清单 (self-hosted apk repos)\n"
              "  PKGARCH:=all\n"
              "  DEPENDS:=+apk-mbedtls\n"
              "endef\n\n"
              "define Package/apk-selfrepo/install\n"
              "\t$(INSTALL_DIR) $(1)/etc/apk/repositories.d\n"
              "\t$(INSTALL_DATA) ./files/etc/apk/repositories.d/99-selfrepo.list $(1)/etc/apk/repositories.d/\n"
              "endef\n\n"
              "$(eval $(call BuildPackage,apk-selfrepo))\n"
          )
          io.open(pkg + "/Makefile", "w", encoding="utf-8").write(mk)

          base = "https://github.com/%s/releases/download/pkgs-%s" % (repo, run)
          lines = [
              "# 本次编译（run %s）自建的 apk 源；编译时生成，不在 .git 里" % run,
              "# 官方源见同目录 distfeeds.list —— 这里只放官方站上不存在的包",
              "#（kmod-* 与 kernel/base-files/libc 等 nonshared 包、本地包、第三方 feed 包）",
              "# 每个 tag 里的 packages.adb 都由本次编译的密钥签名，",
              "# 对应公钥已由 base-files 装进 /etc/apk/keys/，无需 --allow-untrusted。",
          ]
          # SELF_TARGET 指向 bin/targets/<board>/<subtarget>/packages（kmods + nonshared 包）
          for f in feeds + [os.environ["SELF_TARGET"]]:
              lines.append("%s-%s/packages.adb" % (base, f))
          io.open(pkg + "/files/etc/apk/repositories.d/99-selfrepo.list",
                  "w", encoding="utf-8").write("\n".join(lines) + "\n")

          print("----- 99-selfrepo.list -----")
          print(io.open(pkg + "/files/etc/apk/repositories.d/99-selfrepo.list",
                        encoding="utf-8").read())
          print("----- apk-selfrepo/Makefile（前 6 行）-----")
          print("".join(io.open(pkg + "/Makefile", encoding="utf-8").readlines()[:6]))
          PY

      - name: 更新 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          # 删掉各 feed 的 .git 和 .github 省空间（后续编译不再需要）
          find feeds -mindepth 2 -maxdepth 2 -name '.git' -type d -exec rm -rf {} + 2>/dev/null || true
          find feeds -mindepth 2 -maxdepth 2 -name '.github' -type d -exec rm -rf {} + 2>/dev/null || true

      # 官方 feed 全量安装；第三方 feed 只装白名单包。
      # 绝不能对第三方 feed 用 install -a —— 会与官方 feed 产生大量重名包。
      - name: 安装 feeds（官方全量 + 第三方白名单）
        run: |
          set -e
          cd openwrt

          echo "===== 1) 官方 feed 全量安装 ====="
          for f in packages luci routing telephony video fanchmwrt; do
            echo "--> feeds install -a -p $f"
            ./scripts/feeds install -a -p "$f"
          done

          echo "===== 2) 第三方 feed 白名单安装 ====="
          ./scripts/feeds install -p passwall_luci      luci-app-passwall

          # ★ PassWall 的可选组件不在 LUCI_DEPENDS 里，只由 Kconfig 的 select 引用：
          #     LUCI_DEPENDS 只含 chinadns-ng / dns2socks / tcping / microsocks 等固定项，
          #     而 geoview / ipt2socks / simple-obfs / v2ray-plugin / shadowsocks-rust /
          #     shadowsocksr-libev 全是 `select PACKAGE_xxx`。
          #   feeds install 不会递归带上这些 → 源包不在 package/feeds/ 时 PACKAGE_xxx
          #   符号根本不存在，select 静默空转，config 里的 INCLUDE_* 就成了空设置。
          #   （实测：run #5 就是因此丢了 geoview 和 ipt2socks）
          #   → 必须显式安装源包。此处仅"装入 feeds"，是否编译由 .config 决定。
          ./scripts/feeds install -p passwall_packages  \
            geoview ipt2socks simple-obfs v2ray-plugin shadowsocks-rust shadowsocksr-libev

          ./scripts/feeds install -p luci_app_easytier  luci-app-easytier easytier
          ./scripts/feeds install -p immortalwrt_packages vlmcsd rtp2httpd
          ./scripts/feeds install -p immortalwrt_luci   luci-app-vlmcsd luci-app-rtp2httpd luci-app-homeproxy

          echo "===== 3) 去重保险：第三方与官方重名的软链一律删除（官方优先）====="
          for td in passwall_luci passwall_packages luci_app_easytier \
                    immortalwrt_packages immortalwrt_luci; do
            [ -d "package/feeds/$td" ] || continue
            for name in $(ls "package/feeds/$td"); do
              for of in packages luci routing telephony video fanchmwrt; do
                if [ -e "package/feeds/$of/$name" ]; then
                  echo "  [去重] 删除 $td/$name（改用官方 $of 版本）"
                  rm -f "package/feeds/$td/$name"
                  break
                fi
              done
            done
          done

          echo "===== 已安装的第三方包 ====="
          for td in passwall_luci passwall_packages luci_app_easytier \
                    immortalwrt_packages immortalwrt_luci; do
            echo "--- $td ---"; ls "package/feeds/$td" 2>/dev/null || echo "(无)"
          done

      # 可选：套用 fanchmwrt 对 luci feed 的本地补丁（feeds_patches/luci）
      - name: 套用 fanchmwrt luci feed 补丁
        if: ${{ github.event.inputs.apply_feeds_patches != 'false' }}
        run: |
          cd openwrt
          [ -d feeds_patches/luci ] || { echo "无 feeds_patches/luci，跳过"; exit 0; }
          cnt=0
          while IFS= read -r p; do
            rel="${p#feeds_patches/luci/}"
            d="feeds/luci/$(dirname "$rel")"
            [ -d "$d" ] || { echo "  [跳过] 目标不存在: $d"; continue; }
            if patch -p1 --dry-run -d "$d" < "$p" >/dev/null 2>&1; then
              patch -p1 -d "$d" < "$p"
              echo "  [已套用] $rel"
              cnt=$((cnt+1))
            else
              echo "  [跳过] 打不上（上游已变更或冲突）: $rel"
            fi
          done < <(find feeds_patches/luci -name '*.patch' -o -name '*.diff' | sort)
          echo "共套用 $cnt 个补丁"

      # ---------------------------------------------------------------
      # 修正 distfeeds.list：只保留官方 7 个源
      #
      # base-files 生成 /etc/apk/repositories.d/distfeeds.list 时调用
      # FeedSourcesAppendAPK，它把 feeds.conf 里**所有** feed 都写成
      #   <VERSION_REPO>/packages/<arch>/<feed>/packages.adb
      # 但官方下载站上只有 base/packages/luci/routing/telephony/video 六个
      # packages feed 目录（外加 targets/<t>/packages）—— 第三方 git feed 的
      # 路径必然 404，而 `apk update` 遇到取不到的源会直接报错。
      # 原版 fanchmwrt 只 sed 掉了自己的 `fanchmwrt` 一行，第三方 feed 全留着。
      # 这里改成显式列出官方源；第三方/本地包由 apk-selfrepo 指向自建 Release。
      # ---------------------------------------------------------------
      - name: 修正 distfeeds.list（只保留官方源）
        run: |
          set -e
          cd openwrt
          python3 - <<'PY'
          import io
          p = "package/base-files/Makefile"
          s = io.open(p, encoding="utf-8").read()

          OLD = (
              "\tmkdir -p $(1)/etc/apk/repositories.d\n"
              "\t$(call FeedSourcesAppendAPK,$(1)/etc/apk/repositories.d/distfeeds.list)\n"
              "\tsed -i '/fanchmwrt/d' $(1)/etc/apk/repositories.d/distfeeds.list\n"
          )
          NEW = (
              "\tmkdir -p $(1)/etc/apk/repositories.d\n"
              "\t# 只写官方源：FeedSourcesAppendAPK 会把第三方 git feed 也写成\n"
              "\t# downloads.openwrt.org/.../<feed>/packages.adb（官方站上没有这个目录，必然 404），\n"
              "\t# 而 apk update 遇到取不到的源会报错。第三方/本地包改由 apk-selfrepo 指向自建源。\n"
              "\t( \\\n"
              "\t  echo '%U/targets/%S/packages/packages.adb'; \\\n"
              "\t  echo '%U/packages/%A/base/packages.adb'; \\\n"
              "\t  echo '%U/packages/%A/packages/packages.adb'; \\\n"
              "\t  echo '%U/packages/%A/luci/packages.adb'; \\\n"
              "\t  echo '%U/packages/%A/routing/packages.adb'; \\\n"
              "\t  echo '%U/packages/%A/telephony/packages.adb'; \\\n"
              "\t  echo '%U/packages/%A/video/packages.adb'; \\\n"
              "\t) > $(1)/etc/apk/repositories.d/distfeeds.list\n"
          )
          assert OLD in s, "base-files/Makefile 的 distfeeds 生成段与预期不符，需人工核对"
          io.open(p, "w", encoding="utf-8").write(s.replace(OLD, NEW))
          print("已打补丁：distfeeds.list 只保留官方源")
          PY

          # 断言：FeedSourcesAppendAPK 调用必须消失，且 7 条源都在
          if grep -q 'FeedSourcesAppendAPK' package/base-files/Makefile; then
            echo "!! 补丁没生效：仍有 FeedSourcesAppendAPK 调用"; exit 1
          fi
          n=$(grep -c "packages.adb';" package/base-files/Makefile)
          echo "  distfeeds 官方源条目数：$n（应为 7）"
          [ "$n" -eq 7 ] || { echo "!! 条目数不对，终止"; exit 1; }

      - name: 载入配置并生成完整 .config
        run: |
          set -e
          cd openwrt
          cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config

          # ccache 加速（配合后面的 actions/cache）
          echo "CONFIG_CCACHE=y" >> .config

          make defconfig

          echo "===== 关键包校验（缺任何一个直接失败）====="
          REQUIRED="
            CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t
            CONFIG_PACKAGE_luci-app-passwall
            CONFIG_PACKAGE_luci-app-homeproxy
            CONFIG_PACKAGE_luci-app-easytier
            CONFIG_PACKAGE_easytier
            CONFIG_PACKAGE_luci-app-frps
            CONFIG_PACKAGE_luci-app-vlmcsd
            CONFIG_PACKAGE_luci-app-rtp2httpd
            CONFIG_PACKAGE_rtp2httpd
            CONFIG_PACKAGE_ddns-scripts-dnspod
            CONFIG_PACKAGE_openssh-sftp-server
            CONFIG_PACKAGE_geoview
            CONFIG_PACKAGE_ipt2socks
            CONFIG_PACKAGE_simple-obfs-client
            CONFIG_PACKAGE_v2ray-plugin
            CONFIG_PACKAGE_shadowsocks-rust-sslocal
            CONFIG_PACKAGE_shadowsocksr-libev-ssr-local
            CONFIG_PACKAGE_sing-box-tiny
            CONFIG_PACKAGE_bind-host
            CONFIG_PACKAGE_luci-app-pushbot
            CONFIG_PACKAGE_luci-i18n-pushbot-zh-cn
            CONFIG_PACKAGE_apk-selfrepo
            CONFIG_PACKAGE_openwrt-keyring
          "
          fail=0
          for k in $REQUIRED; do
            if grep -q "^$k=y" .config; then echo "  [OK]   $k=y"; else echo "  [FAIL] $k 未启用"; fail=1; fi
          done

          # sing-box 只允许 tiny 变体：full 版和 tiny 带 CONFLICTS，同时进固件会让组装阶段报包冲突。
          # 尤其要盯住 PassWall 的 INCLUDE_SingBox —— 它是无条件 select PACKAGE_sing-box。
          #
          # xray-core 同理，而且更隐蔽：它由 PassWall 的 INCLUDE_Xray 段里一句原生 Kconfig
          #     select PACKAGE_xray-core
          # 引入（该段定义在 luci-app-passwall/Makefile 的 define Package/.../config 里，
          # 原样嵌进生成的 Kconfig）。Kconfig 的 select 优先级高于用户设置，
          # 在 .config 里手写 CONFIG_PACKAGE_xray-core=n 会被 make defconfig 翻回 y。
          # 所以要真正确保它不编译，唯一开关是 INCLUDE_Xray=n，这里再做一道闸。
          echo "===== 互斥校验（必须未启用）====="
          FORBIDDEN="
            CONFIG_PACKAGE_sing-box
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox
            CONFIG_PACKAGE_xray-core
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray
          "
          for k in $FORBIDDEN; do
            if grep -q "^$k=y" .config; then
              echo "  [FAIL] $k=y —— 与既定精简目标冲突"; fail=1
            else
              echo "  [OK]   $k 未启用"
            fi
          done

          echo "----- 代理内核实况（应只见 sing-box-tiny，无 xray-core）-----"
          grep -E '^CONFIG_PACKAGE_(sing-box|xray-core)|^# CONFIG_PACKAGE_(sing-box|xray-core)' .config || echo "  (无)"

          [ "$fail" -eq 0 ] || { echo "配置校验失败，终止编译"; exit 1; }

          echo "===== 磁盘占用 ====="; df -h /; du -sh . 2>/dev/null || true

      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ env.REPO_BRANCH }}-${{ github.sha }}
          restore-keys: ccache-${{ env.REPO_BRANCH }}-

      - name: 下载源码包 (dl)
        run: |
          cd openwrt
          make download -j$(nproc) || make download -j1 V=s

      - name: 编译固件
        id: compile
        run: |
          set -o pipefail
          cd openwrt
          echo "开始编译：$(date)"
          make -j$(( $(nproc) + 1 )) || make -j1 V=s
          echo "status=success" >> "$GITHUB_OUTPUT"
          echo "编译结束：$(date)"
          ls -lh bin/targets/${{ env.TARGET }}/

      - name: 显示产物
        if: steps.compile.outputs.status == 'success'
        run: |
          ls -lh openwrt/bin/targets/${{ env.TARGET }}/
          echo "----- feeds 包（bin/packages）-----"
          echo "  apk 数量: $(find openwrt/bin/packages -name '*.apk' 2>/dev/null | wc -l)"
          du -sh openwrt/bin/packages 2>/dev/null || true
          echo "----- 代理核心终检：xray-core 必须缺席、sing-box 必须在 -----"
          MAN=$(ls openwrt/bin/targets/${{ env.TARGET }}/*.manifest 2>/dev/null | head -1)
          if [ -n "$MAN" ]; then
            if grep -q '^xray-core ' "$MAN"; then
              echo "  [FAIL] manifest 里出现 xray-core —— 与 INCLUDE_Xray=n 的预期不符"
              exit 1
            else
              echo "  [OK]   manifest 里没有 xray-core"
            fi
            grep -E '^(sing-box|sing-box-tiny|luci-app-passwall|luci-app-homeproxy) ' "$MAN" || echo "  !! 未见 sing-box / passwall"
          else
            echo "  (未找到 manifest)"
          fi
          echo "----- 分区/体积对照 -----"
          echo "AX3000T stock 布局：ubi_kernel 34MB / ubi 78MB（rootfs 落在这里）"
          echo "----- 自建源目录实况（决定「发布自建 apk 源」会产出哪些 tag）-----"
          echo "[bin/packages/${ARCH_PKG}/]"
          for d in openwrt/bin/packages/${ARCH_PKG}/*/; do
            [ -d "$d" ] || continue
            apks=$(ls "$d" 2>/dev/null | grep -c '\.apk$')
            idx=$([ -f "$d/packages.adb" ] && echo 有 || echo 无)
            echo "  $(basename "$d")   apk=${apks}   packages.adb=${idx}"
          done
          echo "[bin/targets/${TARGET}/packages]（kmod-* 与 nonshared 包）"
          td="openwrt/bin/targets/${TARGET}/packages"
          echo "  apk=$(ls "$td" 2>/dev/null | grep -c '\.apk$')   kmod=$(ls "$td" 2>/dev/null | grep -c '^kmod-')   packages.adb=$([ -f "$td/packages.adb" ] && echo 有 || echo 无)"
          echo "  （本固件未开 CONFIG_BUILDBOT，故没有 kmods/ 目录，kmod 就在上面这个目录里）"

      # 把本次编译的包发布成本仓库的 Release（每个目录一个 Release）。固件里的
      # apk-selfrepo 正是按 `<...>/releases/download/pkgs-<run>-<name>/packages.adb`
      # 指向它们，tag 带 run 号 → 一一对应，不会串版本，也不会串签名密钥
      # （每次编译都会重新生成 private-key.pem，公钥随固件一起进 /etc/apk/keys/）。
      # 只保留最近 5 次编译的源（KEEP_N），更早的自动清理（每个约 50~200MB）。
      #
      # ⚠️ continue-on-error 是必须的：本步骤在「上传固件」之前。GitHub Actions 里
      # 某步失败后，后续 step 的条件会隐含 success() 而被跳过 —— 若这里硬失败
      # （set -e 下 gh release create/upload 任一报错），下面 213MB 的固件产物就
      # 一起废了，等于白编 4 小时。加了它之后：发布出问题"只"标这一格红，
      # 固件照常上传；真正的把关交给最后一步「校验自建源可达性」（if: always()）。
      - name: 发布自建 apk 源（Release）
        if: steps.compile.outputs.status == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          RUN=${{ github.run_number }}
          missing=""

          publish() {   # $1=源名  $2=目录
            dir="$2"
            if [ ! -d "$dir" ]; then echo "  [缺失] $1：$dir 不存在"; missing="$missing $1"; return 0; fi
            n=$(find "$dir" -maxdepth 1 -type f \( -name '*.apk' -o -name 'packages.adb' \) | wc -l)
            if [ "$n" -eq 0 ]; then echo "  [空]   $1：目录里没有 apk"; missing="$missing $1"; return 0; fi
            if [ ! -f "$dir/packages.adb" ]; then
              echo "  [缺索引] $1：$dir 没有 packages.adb"; missing="$missing $1"; return 0
            fi
            tag="pkgs-${RUN}-$1"
            gh release delete "$tag" --yes --cleanup-tag >/dev/null 2>&1 || true
            gh release create "$tag" --title "$tag" \
              --notes "run ${RUN} 自动生成：$1 的 packages.adb + $((n-1)) 个 apk。固件 pkgs-${RUN} 专用，请勿手动增删。" >/dev/null
            find "$dir" -maxdepth 1 -type f \( -name '*.apk' -o -name 'packages.adb' \) -print0 \
              | xargs -0 -n 30 gh release upload "$tag" --clobber
            echo "  [OK]   $tag ← ${n} 个文件"
          }

          # ① target：kmod-* + kernel/base-files/libc 等 nonshared 包
          publish "$SELF_TARGET" "openwrt/bin/targets/${TARGET}/packages"
          # ② bin/packages/<arch>/ 下各 feed 与本地包
          for f in $SELF_FEEDS; do
            publish "$f" "openwrt/bin/packages/${ARCH_PKG}/${f}"
          done

          echo "----- 清理旧源（保留最近 5 次编译）-----"
          # ⚠️ 旧固件的 selfrepo URL 里带 run 号，一旦这些 Release 被清掉，
          # 旧固件上的 `apk update` 就会报源取不到。所以保留次数不能太小；
          # 想永久保留就整段注释掉（每个 run 的包约 60~70MB）。
          KEEP_N=5
          ALL=$(gh release list --limit 300 --json tagName --jq '.[].tagName' 2>/dev/null \
                | grep '^pkgs-' || true)
          KEEP=$(echo "$ALL" | sed -E 's/^pkgs-([0-9]+)-.*/\1/' | sort -n -u | tail -"$KEEP_N" | tr '\n' ' ')
          echo "  保留 run：$KEEP"
          echo "$ALL" | while read -r t; do
            [ -n "$t" ] || continue
            r=$(echo "$t" | sed -E 's/^pkgs-([0-9]+)-.*/\1/')
            case " $KEEP " in
              *" $r "*) ;;
              *) echo "  清理：$t"; gh release delete "$t" --yes --cleanup-tag >/dev/null 2>&1 || true ;;
            esac
          done

          echo "----- 当前 pkgs-* Release -----"
          gh release list --limit 40 | grep '^pkgs-' || true
          if [ -n "$missing" ]; then echo "!! 以下源没有发布成：$missing"; fi

      - name: SSH 调试（失败时可选）
        if: (failure() || cancelled()) && inputs.ssh == 'true'
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 60

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-ax3000t-stock-logs
          # .config 是隐藏文件，upload-artifact@v4 默认会跳过隐藏文件，
          # 不加这一行日志产物根本不会生成（run #5 就是空的）。
          include-hidden-files: true
          path: |
            openwrt/logs/
            openwrt/.config
          if-no-files-found: ignore
          retention-days: 7

      - name: 上传固件
        if: steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-ax3000t-stock-${{ github.run_number }}
          path: |
            openwrt/bin/targets/${{ env.TARGET }}/*.bin
            openwrt/bin/targets/${{ env.TARGET }}/*.ubi
            openwrt/bin/targets/${{ env.TARGET }}/*.itb
            openwrt/bin/targets/${{ env.TARGET }}/*.tar.gz
            openwrt/bin/targets/${{ env.TARGET }}/*.manifest
            openwrt/bin/targets/${{ env.TARGET }}/packages/**
            # ★ feeds 包在另一棵树里：bin/targets/.../packages 只放 target 自建包
            # （kmod-* 之类，run #5 只有 117 个），而 luci-app-*、sing-box、
            # passwall 系列、bind 等由 feeds 构建的 apk 全在 bin/packages/<arch>/<feed>/。
            # 不加这一行，产物里就没有这些 apk，想在路由器上单独 apk add 会缺文件。
            openwrt/bin/packages/**
          if-no-files-found: warn
          retention-days: 14

      # 固件里的 99-selfrepo.list 把 URL 写死了，任一 404 就是「装不上源里的软件」。
      # 因此编译结束后必须逐条验一遍。
      # 刻意放在【最后一步】并带 always()：
      #   · GitHub Actions 里某步失败后，后续步骤的条件默认隐含 success()，会被跳过；
      #     放最后才能保证即使这里红了，上面的固件与日志产物都已经上传完成。
      - name: 校验自建源可达性
        if: always()
        run: |
          RUN=${{ github.run_number }}
          echo "----- 逐条验证 pkgs-${RUN}-* 的 packages.adb -----"
          bad=0
          tot=0
          for f in $SELF_FEEDS $SELF_TARGET; do
            tot=$((tot+1))
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/pkgs-${RUN}-${f}/packages.adb"
            # 匿名拉取（不带头），复现路由器上的真实访问方式
            code=$(curl -sL -o /dev/null -w '%{http_code}' --retry 2 --max-time 30 "$url" || echo 000)
            if [ "$code" = "200" ]; then
              echo "  [OK]   $url"
            else
              echo "  [FAIL] $url → HTTP $code （固件里这条源会报错）"
              bad=$((bad+1))
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo "!! 有 $bad/$tot 条自建源取不到。请看「发布自建 apk 源」步骤里的 [缺失]/[空]/[缺索引] 提示。"
            exit 1
          fi
          echo "全部 $tot 条自建源均可达（固件的 apk update 不会因源 404 报错）。"
